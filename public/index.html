<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140c12">
  <meta name="robots" content="noindex">
  <meta name="description" content="Roast My Room takes a photo, lets Grok roast it, and reveals a glow-up.">
  <title>Roast My Room</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <a class="brand" href="/">Roast My Room</a>
      <div class="toggle" id="intensity" role="radiogroup" aria-label="Roast intensity" data-value="gentle">
        <span class="toggle-thumb" aria-hidden="true"></span>
        <button type="button" role="radio" aria-checked="true" data-value="gentle">Gentle</button>
        <button type="button" role="radio" aria-checked="false" data-value="savage">Savage</button>
      </div>
    </header>
    <p id="banner" class="banner" hidden></p>
    <main id="view"></main>
    <footer id="foot" class="foot"></footer>
  </div>
  <script src="/app.js" type="module"></script>
</body>
</html>
